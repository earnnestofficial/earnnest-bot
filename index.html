<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Earnnest Bot</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body{
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
  background:#1f2937;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.container{
  text-align:center;
}
button{
  background:#22c55e;
  color:#fff;
  border:none;
  padding:15px 35px;
  border-radius:10px;
  font-size:18px;
  cursor:pointer;
}
button:hover{
  background:#16a34a;
}
</style>

</head>
<body>

<div class="container">
  <h1>Welcome to Earnnest Bot</h1>
  <p>Telegram Mini App Ready!</p>
  <button onclick="startApp()">Start</button>
</div>

<script>
Telegram.WebApp.ready();

function startApp(){
  alert("Mini App is working!");
}
</script>

</body>
</html>
